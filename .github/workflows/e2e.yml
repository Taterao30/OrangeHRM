name: OrangeHRM Enhanced E2E CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Run pipeline up to environment'
        required: true
        default: 'QA'
        type: choice
        options:
          - Dev
          - QA
          - Stage
          - Prod

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Pipeline metadata
        run: |
          echo "=========================================="
          echo "       ORANGEHRM E2E CI/CD PIPELINE"
          echo "=========================================="
          echo "Selected Environment: ${{ github.event.inputs.environment }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered By: ${{ github.actor }}"

  deploy-dev:
    name: Deploy to DEV
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Deploy application to DEV
        run: echo "OrangeHRM deployed to DEV successfully"

  sanity-dev:
    name: DEV - Sanity Tests
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: Dev
    env:
      ENV: dev
      ORANGE_BASE_URL: ${{ secrets.ORANGE_BASE_URL }}
      ORANGE_USERNAME: ${{ secrets.ORANGE_USERNAME }}
      ORANGE_PASSWORD: ${{ secrets.ORANGE_PASSWORD }}
    steps:
      - name: Checkout OrangeHRM repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Playwright browsers
        id: pw-cache-dev
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.pw-cache-dev.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium OS dependencies
        if: steps.pw-cache-dev.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Validate DEV secrets
        shell: bash
        run: |
          [ -n "$ORANGE_BASE_URL" ] || { echo "ERROR: ORANGE_BASE_URL secret is missing"; exit 1; }
          [ -n "$ORANGE_USERNAME" ] || { echo "ERROR: ORANGE_USERNAME secret is missing"; exit 1; }
          [ -n "$ORANGE_PASSWORD" ] || { echo "ERROR: ORANGE_PASSWORD secret is missing"; exit 1; }
          echo "DEV secrets are available"

      - name: Run DEV Sanity Tests
        run: npx playwright test --project=chromium --grep "@sanity" --workers=1

      - name: Generate Allure Report if results exist
        if: always()
        shell: bash
        run: |
          if [ -d "allure-results" ] && [ "$(find allure-results -type f | wc -l)" -gt 0 ]; then
            npm install -g allure-commandline
            allure generate allure-results --clean -o allure-report
          else
            echo "No allure-results found. Skipping Allure generation."
          fi

      - name: Upload DEV Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-sanity-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload DEV Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-sanity-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload DEV Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-sanity-allure-report
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload DEV ReportingLabs Report if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-sanity-reportinglabs-report
          path: reporting-labs/
          if-no-files-found: ignore
          retention-days: 30

  deploy-qa:
    name: Deploy to QA
    needs: sanity-dev
    if: contains(fromJSON('["QA","Stage","Prod"]'), github.event.inputs.environment)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy application to QA
        run: echo "OrangeHRM deployed to QA successfully"

  regression-qa:
    name: QA - Regression Tests
    needs: deploy-qa
    if: contains(fromJSON('["QA","Stage","Prod"]'), github.event.inputs.environment)
    runs-on: ubuntu-latest
    environment: QA
    env:
      ENV: qa
      ORANGE_BASE_URL: ${{ secrets.ORANGE_BASE_URL }}
      ORANGE_USERNAME: ${{ secrets.ORANGE_USERNAME }}
      ORANGE_PASSWORD: ${{ secrets.ORANGE_PASSWORD }}
    steps:
      - name: Checkout OrangeHRM repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Playwright browsers
        id: pw-cache-qa
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.pw-cache-qa.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium OS dependencies
        if: steps.pw-cache-qa.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Validate QA secrets
        shell: bash
        run: |
          [ -n "$ORANGE_BASE_URL" ] || { echo "ERROR: ORANGE_BASE_URL secret is missing"; exit 1; }
          [ -n "$ORANGE_USERNAME" ] || { echo "ERROR: ORANGE_USERNAME secret is missing"; exit 1; }
          [ -n "$ORANGE_PASSWORD" ] || { echo "ERROR: ORANGE_PASSWORD secret is missing"; exit 1; }
          echo "QA secrets are available"

      - name: Run QA Regression Tests
        run: npx playwright test --project=chromium --grep "@regression" --workers=1

      - name: Generate Allure Report if results exist
        if: always()
        shell: bash
        run: |
          if [ -d "allure-results" ] && [ "$(find allure-results -type f | wc -l)" -gt 0 ]; then
            npm install -g allure-commandline
            allure generate allure-results --clean -o allure-report
          else
            echo "No allure-results found. Skipping Allure generation."
          fi

      - name: Upload QA Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload QA Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload QA Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-allure-report
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload QA ReportingLabs Report if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-reportinglabs-report
          path: reporting-labs/
          if-no-files-found: ignore
          retention-days: 30

  deploy-stage:
    name: Deploy to STAGE
    needs: regression-qa
    if: contains(fromJSON('["Stage","Prod"]'), github.event.inputs.environment)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy application to STAGE
        run: echo "OrangeHRM deployed to STAGE successfully"

  sanity-stage:
    name: STAGE - Sanity Tests
    needs: deploy-stage
    if: contains(fromJSON('["Stage","Prod"]'), github.event.inputs.environment)
    runs-on: ubuntu-latest
    environment: Stage
    env:
      ENV: stage
      ORANGE_BASE_URL: ${{ secrets.ORANGE_BASE_URL }}
      ORANGE_USERNAME: ${{ secrets.ORANGE_USERNAME }}
      ORANGE_PASSWORD: ${{ secrets.ORANGE_PASSWORD }}
    steps:
      - name: Checkout OrangeHRM repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Playwright browsers
        id: pw-cache-stage
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.pw-cache-stage.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium OS dependencies
        if: steps.pw-cache-stage.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Validate STAGE secrets
        shell: bash
        run: |
          [ -n "$ORANGE_BASE_URL" ] || { echo "ERROR: ORANGE_BASE_URL secret is missing"; exit 1; }
          [ -n "$ORANGE_USERNAME" ] || { echo "ERROR: ORANGE_USERNAME secret is missing"; exit 1; }
          [ -n "$ORANGE_PASSWORD" ] || { echo "ERROR: ORANGE_PASSWORD secret is missing"; exit 1; }
          echo "STAGE secrets are available"

      - name: Run STAGE Sanity Tests
        run: npx playwright test --project=chromium --grep "@sanity" --workers=1

      - name: Generate Allure Report if results exist
        if: always()
        shell: bash
        run: |
          if [ -d "allure-results" ] && [ "$(find allure-results -type f | wc -l)" -gt 0 ]; then
            npm install -g allure-commandline
            allure generate allure-results --clean -o allure-report
          else
            echo "No allure-results found. Skipping Allure generation."
          fi

      - name: Upload STAGE Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-sanity-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload STAGE Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-sanity-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload STAGE Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-sanity-allure-report
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload STAGE ReportingLabs Report if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-sanity-reportinglabs-report
          path: reporting-labs/
          if-no-files-found: ignore
          retention-days: 30

  deploy-prod:
    name: Deploy to PROD
    needs: sanity-stage
    if: github.event.inputs.environment == 'Prod'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy application to PROD
        run: echo "OrangeHRM deployed to PROD successfully"

  smoke-prod:
    name: PROD - Smoke Tests
    needs: deploy-prod
    if: github.event.inputs.environment == 'Prod'
    runs-on: ubuntu-latest
    environment: Prod
    env:
      ENV: prod
      ORANGE_BASE_URL: ${{ secrets.ORANGE_BASE_URL }}
      ORANGE_USERNAME: ${{ secrets.ORANGE_USERNAME }}
      ORANGE_PASSWORD: ${{ secrets.ORANGE_PASSWORD }}
    steps:
      - name: Checkout OrangeHRM repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Playwright browsers
        id: pw-cache-prod
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.pw-cache-prod.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium OS dependencies
        if: steps.pw-cache-prod.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Validate PROD secrets
        shell: bash
        run: |
          [ -n "$ORANGE_BASE_URL" ] || { echo "ERROR: ORANGE_BASE_URL secret is missing"; exit 1; }
          [ -n "$ORANGE_USERNAME" ] || { echo "ERROR: ORANGE_USERNAME secret is missing"; exit 1; }
          [ -n "$ORANGE_PASSWORD" ] || { echo "ERROR: ORANGE_PASSWORD secret is missing"; exit 1; }
          echo "PROD secrets are available"

      - name: Run PROD Smoke Tests
        run: npx playwright test --project=chromium --grep "@smoke" --workers=1

      - name: Generate Allure Report if results exist
        if: always()
        shell: bash
        run: |
          if [ -d "allure-results" ] && [ "$(find allure-results -type f | wc -l)" -gt 0 ]; then
            npm install -g allure-commandline
            allure generate allure-results --clean -o allure-report
          else
            echo "No allure-results found. Skipping Allure generation."
          fi

      - name: Upload PROD Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload PROD Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload PROD Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-allure-report
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload PROD ReportingLabs Report if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-reportinglabs-report
          path: reporting-labs/
          if-no-files-found: ignore
          retention-days: 30

  notify:
    name: Publish Reports + Notify
    needs: [prepare, sanity-dev, regression-qa, sanity-stage, smoke-prod]
    if: always()
    runs-on: ubuntu-latest
    env:
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Set Pipeline Status
        id: status
        shell: bash
        run: |
          PREPARE="${{ needs.prepare.result }}"
          DEV="${{ needs.sanity-dev.result }}"
          QA="${{ needs.regression-qa.result }}"
          STAGE="${{ needs.sanity-stage.result }}"
          PROD="${{ needs.smoke-prod.result }}"

          get_emoji() {
            if [ "$1" = "success" ]; then echo "✅";
            elif [ "$1" = "skipped" ]; then echo "⏭️";
            else echo "❌"; fi
          }

          echo "prepare=$(get_emoji "$PREPARE")" >> "$GITHUB_OUTPUT"
          echo "dev=$(get_emoji "$DEV")" >> "$GITHUB_OUTPUT"
          echo "qa=$(get_emoji "$QA")" >> "$GITHUB_OUTPUT"
          echo "stage=$(get_emoji "$STAGE")" >> "$GITHUB_OUTPUT"
          echo "prod=$(get_emoji "$PROD")" >> "$GITHUB_OUTPUT"

          FAILED=false
          for result in "$PREPARE" "$DEV" "$QA" "$STAGE" "$PROD"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then FAILED=true; fi
          done

          if [ "$FAILED" = "true" ]; then
            echo "overall=❌ SOME FAILURES" >> "$GITHUB_OUTPUT"
          else
            echo "overall=✅ ALL PASSED" >> "$GITHUB_OUTPUT"
          fi

          REPORT_BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/runs/${{ github.run_id }}"
          echo "report_url=$REPORT_BASE" >> "$GITHUB_OUTPUT"

      - name: Download All Reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: Build GitHub Pages Dashboard
        shell: bash
        run: |
          mkdir -p pages-deploy/runs/${{ github.run_id }}

          cat > pages-deploy/runs/${{ github.run_id }}/index.html << 'INDEXPAGE'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>OrangeHRM Pipeline Reports</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 0; padding: 40px; background: #f5f5f5; }
              .container { max-width: 900px; margin: 0 auto; }
              h1 { color: #1a1a2e; }
              .meta { color: #666; margin-bottom: 24px; }
              .card { background: white; border-radius: 12px; padding: 24px; margin: 16px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
              .btn { display: inline-block; padding: 10px 18px; border-radius: 8px; text-decoration: none; color: white; background: #1a1a2e; margin: 4px; }
              .allure { background: #28a745; }
              .rlabs { background: #6f42c1; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>OrangeHRM Playwright CI/CD Reports</h1>
              <p class="meta">Environment: ENV_SELECTED | Run: RUN_ID | Branch: BRANCH</p>
              <div class="card"><h2>DEV - Sanity</h2><a class="btn" href="dev-html/index.html">Playwright HTML</a><a class="btn allure" href="dev-allure/index.html">Allure</a><a class="btn rlabs" href="dev-rlabs/index.html">ReportingLabs</a></div>
              <div class="card"><h2>QA - Regression</h2><a class="btn" href="qa-html/index.html">Playwright HTML</a><a class="btn allure" href="qa-allure/index.html">Allure</a><a class="btn rlabs" href="qa-rlabs/index.html">ReportingLabs</a></div>
              <div class="card"><h2>STAGE - Sanity</h2><a class="btn" href="stage-html/index.html">Playwright HTML</a><a class="btn allure" href="stage-allure/index.html">Allure</a><a class="btn rlabs" href="stage-rlabs/index.html">ReportingLabs</a></div>
              <div class="card"><h2>PROD - Smoke</h2><a class="btn" href="prod-html/index.html">Playwright HTML</a><a class="btn allure" href="prod-allure/index.html">Allure</a><a class="btn rlabs" href="prod-rlabs/index.html">ReportingLabs</a></div>
            </div>
          </body>
          </html>
          INDEXPAGE

          sed -i "s|RUN_ID|${{ github.run_id }}|g" pages-deploy/runs/${{ github.run_id }}/index.html
          sed -i "s|BRANCH|${{ github.ref_name }}|g" pages-deploy/runs/${{ github.run_id }}/index.html
          sed -i "s|ENV_SELECTED|${{ github.event.inputs.environment }}|g" pages-deploy/runs/${{ github.run_id }}/index.html

          cp -r all-reports/dev-sanity-playwright-report/ pages-deploy/runs/${{ github.run_id }}/dev-html/ 2>/dev/null || true
          cp -r all-reports/dev-sanity-allure-report/ pages-deploy/runs/${{ github.run_id }}/dev-allure/ 2>/dev/null || true
          cp -r all-reports/dev-sanity-reportinglabs-report/ pages-deploy/runs/${{ github.run_id }}/dev-rlabs/ 2>/dev/null || true
          cp -r all-reports/qa-regression-playwright-report/ pages-deploy/runs/${{ github.run_id }}/qa-html/ 2>/dev/null || true
          cp -r all-reports/qa-regression-allure-report/ pages-deploy/runs/${{ github.run_id }}/qa-allure/ 2>/dev/null || true
          cp -r all-reports/qa-regression-reportinglabs-report/ pages-deploy/runs/${{ github.run_id }}/qa-rlabs/ 2>/dev/null || true
          cp -r all-reports/stage-sanity-playwright-report/ pages-deploy/runs/${{ github.run_id }}/stage-html/ 2>/dev/null || true
          cp -r all-reports/stage-sanity-allure-report/ pages-deploy/runs/${{ github.run_id }}/stage-allure/ 2>/dev/null || true
          cp -r all-reports/stage-sanity-reportinglabs-report/ pages-deploy/runs/${{ github.run_id }}/stage-rlabs/ 2>/dev/null || true
          cp -r all-reports/prod-smoke-playwright-report/ pages-deploy/runs/${{ github.run_id }}/prod-html/ 2>/dev/null || true
          cp -r all-reports/prod-smoke-allure-report/ pages-deploy/runs/${{ github.run_id }}/prod-allure/ 2>/dev/null || true
          cp -r all-reports/prod-smoke-reportinglabs-report/ pages-deploy/runs/${{ github.run_id }}/prod-rlabs/ 2>/dev/null || true

      - name: Deploy Reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages-deploy
          keep_files: true

      - name: Create Email Dashboard
        shell: bash
        run: |
          REPORT_URL="${{ steps.status.outputs.report_url }}"
          cat > dashboard.html << DASHBOARD
          <!DOCTYPE html>
          <html>
          <body style="font-family:Arial,sans-serif;background:#f5f5f5;padding:20px">
            <div style="max-width:700px;margin:auto;background:white;border-radius:12px;padding:24px">
              <h2>OrangeHRM Playwright CI/CD Dashboard</h2>
              <p><strong>Environment:</strong> ${{ github.event.inputs.environment }}</p>
              <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
              <p><strong>Triggered By:</strong> ${{ github.actor }}</p>
              <p><strong>Overall:</strong> ${{ steps.status.outputs.overall }}</p>
              <table style="width:100%;border-collapse:collapse">
                <tr><th align="left">Stage</th><th align="left">Suite</th><th>Status</th></tr>
                <tr><td>DEV</td><td>Sanity</td><td>${{ steps.status.outputs.dev }}</td></tr>
                <tr><td>QA</td><td>Regression</td><td>${{ steps.status.outputs.qa }}</td></tr>
                <tr><td>STAGE</td><td>Sanity</td><td>${{ steps.status.outputs.stage }}</td></tr>
                <tr><td>PROD</td><td>Smoke</td><td>${{ steps.status.outputs.prod }}</td></tr>
              </table>
              <p style="margin-top:24px"><a href="${REPORT_URL}/index.html">View All Reports</a></p>
            </div>
          </body>
          </html>
          DASHBOARD

      - name: Send Email Notification
        if: env.EMAIL_USERNAME != '' && env.EMAIL_PASSWORD != '' && env.EMAIL_TO != '' && env.SMTP_SERVER != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          secure: true
          username: ${{ env.EMAIL_USERNAME }}
          password: ${{ env.EMAIL_PASSWORD }}
          subject: "OrangeHRM CI/CD [${{ github.event.inputs.environment }}] - ${{ steps.status.outputs.overall }}"
          to: ${{ env.EMAIL_TO }}
          from: "OrangeHRM CI Bot <${{ env.EMAIL_USERNAME }}>"
          html_body: file://dashboard.html

      - name: Send Slack Notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "OrangeHRM CI/CD Pipeline",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "OrangeHRM Playwright CI/CD" }
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*Overall:* ${{ steps.status.outputs.overall }}\n*Run up to:* `${{ github.event.inputs.environment }}`\n*Branch:* `${{ github.ref_name }}`\n*Triggered by:* `${{ github.actor }}`" }
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "${{ steps.status.outputs.dev }} *DEV* - Sanity\n${{ steps.status.outputs.qa }} *QA* - Regression\n${{ steps.status.outputs.stage }} *STAGE* - Sanity\n${{ steps.status.outputs.prod }} *PROD* - Smoke" }
                },
                {
                  "type": "actions",
                  "elements": [
                    { "type": "button", "text": { "type": "plain_text", "text": "View Reports" }, "url": "${{ steps.status.outputs.report_url }}/index.html" },
                    { "type": "button", "text": { "type": "plain_text", "text": "GitHub Actions" }, "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}

      - name: Pipeline Summary
        run: |
          echo "=============================================="
          echo "       ORANGEHRM PIPELINE SUMMARY"
          echo "=============================================="
          echo "Selected Environment: ${{ github.event.inputs.environment }}"
          echo "DEV Sanity:    ${{ needs.sanity-dev.result }}"
          echo "QA Regression: ${{ needs.regression-qa.result }}"
          echo "STAGE Sanity:  ${{ needs.sanity-stage.result }}"
          echo "PROD Smoke:    ${{ needs.smoke-prod.result }}"
          echo "Reports:       ${{ steps.status.outputs.report_url }}/index.html"
          echo "=============================================="
