name: OrangeHRM Master CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Run pipeline up to environment
        required: true
        default: QA
        type: choice
        options:
          - Dev
          - QA
          - Stage
          - Prod


jobs:

  # =========================================================
  # STEP 1 - PREPARE PIPELINE
  # Always runs
  # =========================================================
  prepare:
    name: Prepare Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Show pipeline information
        run: |
          echo "=========================================="
          echo "       ORANGEHRM MASTER PIPELINE"
          echo "=========================================="
          echo "Selected Environment: ${{ github.event.inputs.environment }}"
          echo "=========================================="


  # =========================================================
  # STEP 2 - DEPLOY TO DEV
  # Always runs
  # =========================================================
  deploy-dev:
    name: Deploy to DEV
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to DEV
        run: |
          echo "=========================================="
          echo "       DEPLOYING TO DEV"
          echo "=========================================="
          echo "OrangeHRM deployed to DEV successfully"


  # =========================================================
  # STEP 3 - DEV SANITY TESTS
  # Always runs
  # =========================================================
  sanity-dev:
    name: DEV - Sanity Tests
    needs: deploy-dev
    runs-on: ubuntu-latest

    env:
      ENV: dev
      ORANGE_BASE_URL: ${{ secrets.ORANGE_BASE_URL }}
      ORANGE_USERNAME: ${{ secrets.ORANGE_USERNAME }}
      ORANGE_PASSWORD: ${{ secrets.ORANGE_PASSWORD }}

    steps:

      - name: Checkout OrangeHRM repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Show DEV configuration
        run: |
          echo "Environment: $ENV"
          echo "Test Suite: SANITY"

      - name: Validate DEV secrets
        shell: bash
        run: |
          if [ -z "$ORANGE_BASE_URL" ]; then
            echo "ERROR: ORANGE_BASE_URL secret is missing"
            exit 1
          fi

          if [ -z "$ORANGE_USERNAME" ]; then
            echo "ERROR: ORANGE_USERNAME secret is missing"
            exit 1
          fi

          if [ -z "$ORANGE_PASSWORD" ]; then
            echo "ERROR: ORANGE_PASSWORD secret is missing"
            exit 1
          fi

          echo "All required DEV secrets are available"

      - name: Run DEV Sanity Tests
        run: |
          echo "=========================================="
          echo "       RUNNING DEV SANITY TESTS"
          echo "=========================================="

          npx playwright test \
            --project=chromium \
            --grep "@sanity" \
            --workers=1

      - name: Upload DEV Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-sanity-playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload DEV Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-sanity-test-results
          path: test-results/
          retention-days: 7


  # =========================================================
  # STEP 4 - DEPLOY TO QA
  # Runs for QA, Stage and Prod
  # =========================================================
  deploy-qa:
    name: Deploy to QA
    needs: sanity-dev

    if: contains(
          fromJSON('["QA","Stage","Prod"]'),
          github.event.inputs.environment
        )

    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to QA
        run: |
          echo "=========================================="
          echo "       DEPLOYING TO QA"
          echo "=========================================="
          echo "OrangeHRM deployed to QA successfully"


  # =========================================================
  # STEP 5 - QA REGRESSION TESTS
  # Runs for QA, Stage and Prod
  # =========================================================
  regression-qa:
    name: QA - Regression Tests
    needs: deploy-qa

    if: contains(
          fromJSON('["QA","Stage","Prod"]'),
          github.event.inputs.environment
        )

    runs-on: ubuntu-latest

    env:
      ENV: qa
      ORANGE_BASE_URL: ${{ secrets.ORANGE_BASE_URL }}
      ORANGE_USERNAME: ${{ secrets.ORANGE_USERNAME }}
      ORANGE_PASSWORD: ${{ secrets.ORANGE_PASSWORD }}

    steps:

      - name: Checkout OrangeHRM repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Show QA configuration
        run: |
          echo "Environment: $ENV"
          echo "Test Suite: REGRESSION"

      - name: Validate QA secrets
        shell: bash
        run: |
          if [ -z "$ORANGE_BASE_URL" ]; then
            echo "ERROR: ORANGE_BASE_URL secret is missing"
            exit 1
          fi

          if [ -z "$ORANGE_USERNAME" ]; then
            echo "ERROR: ORANGE_USERNAME secret is missing"
            exit 1
          fi

          if [ -z "$ORANGE_PASSWORD" ]; then
            echo "ERROR: ORANGE_PASSWORD secret is missing"
            exit 1
          fi

          echo "All required QA secrets are available"

      - name: Run QA Regression Tests
        run: |
          echo "=========================================="
          echo "       RUNNING QA REGRESSION TESTS"
          echo "=========================================="

          npx playwright test \
            --project=chromium \
            --grep "@regression" \
            --workers=1

      - name: Upload QA Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload QA Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-test-results
          path: test-results/
          retention-days: 7


  # =========================================================
  # STEP 6 - DEPLOY TO STAGE
  # Runs for Stage and Prod
  # =========================================================
  deploy-stage:
    name: Deploy to STAGE
    needs: regression-qa

    if: contains(
          fromJSON('["Stage","Prod"]'),
          github.event.inputs.environment
        )

    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to STAGE
        run: |
          echo "=========================================="
          echo "       DEPLOYING TO STAGE"
          echo "=========================================="
          echo "OrangeHRM deployed to STAGE successfully"


  # =========================================================
  # STEP 7 - STAGE SANITY TESTS
  # Runs for Stage and Prod
  # =========================================================
  sanity-stage:
    name: STAGE - Sanity Tests
    needs: deploy-stage

    if: contains(
          fromJSON('["Stage","Prod"]'),
          github.event.inputs.environment
        )

    runs-on: ubuntu-latest

    env:
      ENV: stage
      ORANGE_BASE_URL: ${{ secrets.ORANGE_BASE_URL }}
      ORANGE_USERNAME: ${{ secrets.ORANGE_USERNAME }}
      ORANGE_PASSWORD: ${{ secrets.ORANGE_PASSWORD }}

    steps:

      - name: Checkout OrangeHRM repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Show STAGE configuration
        run: |
          echo "Environment: $ENV"
          echo "Test Suite: SANITY"

      - name: Validate STAGE secrets
        shell: bash
        run: |
          if [ -z "$ORANGE_BASE_URL" ]; then
            echo "ERROR: ORANGE_BASE_URL secret is missing"
            exit 1
          fi

          if [ -z "$ORANGE_USERNAME" ]; then
            echo "ERROR: ORANGE_USERNAME secret is missing"
            exit 1
          fi

          if [ -z "$ORANGE_PASSWORD" ]; then
            echo "ERROR: ORANGE_PASSWORD secret is missing"
            exit 1
          fi

          echo "All required STAGE secrets are available"

      - name: Run STAGE Sanity Tests
        run: |
          echo "=========================================="
          echo "       RUNNING STAGE SANITY TESTS"
          echo "=========================================="

          npx playwright test \
            --project=chromium \
            --grep "@sanity" \
            --workers=1

      - name: Upload STAGE Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-sanity-playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload STAGE Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-sanity-test-results
          path: test-results/
          retention-days: 7


  # =========================================================
  # STEP 8 - DEPLOY TO PROD
  # Runs only for Prod
  # =========================================================
  deploy-prod:
    name: Deploy to PROD
    needs: sanity-stage

    if: github.event.inputs.environment == 'Prod'

    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to PROD
        run: |
          echo "=========================================="
          echo "       DEPLOYING TO PROD"
          echo "=========================================="
          echo "OrangeHRM deployed to PROD successfully"


  # =========================================================
  # STEP 9 - PROD SMOKE TESTS
  # Runs only for Prod
  # =========================================================
  smoke-prod:
    name: PROD - Smoke Tests
    needs: deploy-prod

    if: github.event.inputs.environment == 'Prod'

    runs-on: ubuntu-latest

    env:
      ENV: prod
      ORANGE_BASE_URL: ${{ secrets.ORANGE_BASE_URL }}
      ORANGE_USERNAME: ${{ secrets.ORANGE_USERNAME }}
      ORANGE_PASSWORD: ${{ secrets.ORANGE_PASSWORD }}

    steps:

      - name: Checkout OrangeHRM repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Show PROD configuration
        run: |
          echo "Environment: $ENV"
          echo "Test Suite: SMOKE"

      - name: Validate PROD secrets
        shell: bash
        run: |
          if [ -z "$ORANGE_BASE_URL" ]; then
            echo "ERROR: ORANGE_BASE_URL secret is missing"
            exit 1
          fi

          if [ -z "$ORANGE_USERNAME" ]; then
            echo "ERROR: ORANGE_USERNAME secret is missing"
            exit 1
          fi

          if [ -z "$ORANGE_PASSWORD" ]; then
            echo "ERROR: ORANGE_PASSWORD secret is missing"
            exit 1
          fi

          echo "All required PROD secrets are available"

      - name: Run PROD Smoke Tests
        run: |
          echo "=========================================="
          echo "       RUNNING PROD SMOKE TESTS"
          echo "=========================================="

          npx playwright test \
            --project=chromium \
            --grep "@smoke" \
            --workers=1

      - name: Upload PROD Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload PROD Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-test-results
          path: test-results/
          retention-days: 7


  # =========================================================
  # STEP 10 - PIPELINE SUMMARY
  # Always runs
  # =========================================================
  summary:
    name: Pipeline Summary

    needs:
      - prepare
      - sanity-dev
      - regression-qa
      - sanity-stage
      - smoke-prod

    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: Pipeline Results
        run: |
          echo "=============================================="
          echo "       ORANGEHRM PIPELINE SUMMARY"
          echo "=============================================="

          echo "Selected Environment:"
          echo "${{ github.event.inputs.environment }}"

          echo "----------------------------------------------"

          echo "Prepare Pipeline:"
          echo "${{ needs.prepare.result }}"

          echo "DEV Sanity:"
          echo "${{ needs.sanity-dev.result }}"

          echo "QA Regression:"
          echo "${{ needs.regression-qa.result }}"

          echo "STAGE Sanity:"
          echo "${{ needs.sanity-stage.result }}"

          echo "PROD Smoke:"
          echo "${{ needs.smoke-prod.result }}"

          echo "=============================================="
          echo "skipped = environment not included in this run"