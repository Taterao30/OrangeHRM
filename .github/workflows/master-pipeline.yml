name: OrangeHRM Master CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Run pipeline up to environment
        required: true
        default: QA
        type: choice
        options:
          - Dev
          - QA
          - Stage
          - Prod

jobs:

  prepare:
    name: Prepare Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Show pipeline information
        run: |
          echo "=========================================="
          echo "       ORANGEHRM MASTER PIPELINE"
          echo "=========================================="
          echo "Selected Environment: ${{ github.event.inputs.environment }}"
          echo "=========================================="


  deploy-dev:
    name: Deploy to DEV
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to DEV
        run: |
          echo "Deploying OrangeHRM to DEV"
          echo "DEV deployment completed"


  sanity-dev:
    name: DEV - Sanity Tests
    needs: deploy-dev
    runs-on: ubuntu-latest

    env:
      ENV: dev
      ORANGE_BASE_URL: ${{ secrets.ORANGE_BASE_URL }}
      ORANGE_USERNAME: ${{ secrets.ORANGE_USERNAME }}
      ORANGE_PASSWORD: ${{ secrets.ORANGE_PASSWORD }}

    steps:
      - name: Checkout OrangeHRM repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate DEV secrets
        shell: bash
        run: |
          if [ -z "$ORANGE_BASE_URL" ]; then
            echo "ERROR: ORANGE_BASE_URL is missing"
            exit 1
          fi

          if [ -z "$ORANGE_USERNAME" ]; then
            echo "ERROR: ORANGE_USERNAME is missing"
            exit 1
          fi

          if [ -z "$ORANGE_PASSWORD" ]; then
            echo "ERROR: ORANGE_PASSWORD is missing"
            exit 1
          fi

          echo "DEV secrets are available"

      - name: Run DEV Sanity Tests
        run: |
          npx playwright test \
            --project=chromium \
            --grep "@sanity" \
            --workers=1

      - name: Upload DEV Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-sanity-playwright-report
          path: playwright-report/
          retention-days: 7


  deploy-qa:
    name: Deploy to QA
    needs: sanity-dev

    if: contains(
          fromJSON('["QA","Stage","Prod"]'),
          github.event.inputs.environment
        )

    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to QA
        run: echo "QA deployment completed"


  regression-qa:
    name: QA - Regression Tests
    needs: deploy-qa

    if: contains(
          fromJSON('["QA","Stage","Prod"]'),
          github.event.inputs.environment
        )

    runs-on: ubuntu-latest

    env:
      ENV: qa
      ORANGE_BASE_URL: ${{ secrets.ORANGE_BASE_URL }}
      ORANGE_USERNAME: ${{ secrets.ORANGE_USERNAME }}
      ORANGE_PASSWORD: ${{ secrets.ORANGE_PASSWORD }}

    steps:
      - name: Checkout OrangeHRM repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run QA Regression Tests
        run: |
          npx playwright test \
            --project=chromium \
            --grep "@regression" \
            --workers=1

      - name: Upload QA Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-playwright-report
          path: playwright-report/
          retention-days: 7


  deploy-stage:
    name: Deploy to STAGE
    needs: regression-qa

    if: contains(
          fromJSON('["Stage","Prod"]'),
          github.event.inputs.environment
        )

    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to STAGE
        run: echo "STAGE deployment completed"


  sanity-stage:
    name: STAGE - Sanity Tests
    needs: deploy-stage

    if: contains(
          fromJSON('["Stage","Prod"]'),
          github.event.inputs.environment
        )

    runs-on: ubuntu-latest

    env:
      ENV: stage
      ORANGE_BASE_URL: ${{ secrets.ORANGE_BASE_URL }}
      ORANGE_USERNAME: ${{ secrets.ORANGE_USERNAME }}
      ORANGE_PASSWORD: ${{ secrets.ORANGE_PASSWORD }}

    steps:
      - name: Checkout OrangeHRM repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run STAGE Sanity Tests
        run: |
          npx playwright test \
            --project=chromium \
            --grep "@sanity" \
            --workers=1

      - name: Upload STAGE Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-sanity-playwright-report
          path: playwright-report/
          retention-days: 7


  deploy-prod:
    name: Deploy to PROD
    needs: sanity-stage

    if: github.event.inputs.environment == 'Prod'

    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to PROD
        run: echo "PROD deployment completed"


  smoke-prod:
    name: PROD - Smoke Tests
    needs: deploy-prod

    if: github.event.inputs.environment == 'Prod'

    runs-on: ubuntu-latest

    env:
      ENV: prod
      ORANGE_BASE_URL: ${{ secrets.ORANGE_BASE_URL }}
      ORANGE_USERNAME: ${{ secrets.ORANGE_USERNAME }}
      ORANGE_PASSWORD: ${{ secrets.ORANGE_PASSWORD }}

    steps:
      - name: Checkout OrangeHRM repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run PROD Smoke Tests
        run: |
          npx playwright test \
            --project=chromium \
            --grep "@smoke" \
            --workers=1

      - name: Upload PROD Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-playwright-report
          path: playwright-report/
          retention-days: 7


  summary:
    name: Pipeline Summary

    needs:
      - prepare
      - sanity-dev
      - regression-qa
      - sanity-stage
      - smoke-prod

    if: always()

    runs-on: ubuntu-latest

    steps:
      - name: Pipeline Results
        run: |
          echo "=============================================="
          echo "       ORANGEHRM PIPELINE SUMMARY"
          echo "=============================================="
          echo "Selected Environment: ${{ github.event.inputs.environment }}"
          echo "Prepare:       ${{ needs.prepare.result }}"
          echo "DEV Sanity:    ${{ needs.sanity-dev.result }}"
          echo "QA Regression: ${{ needs.regression-qa.result }}"
          echo "STAGE Sanity:  ${{ needs.sanity-stage.result }}"
          echo "PROD Smoke:    ${{ needs.smoke-prod.result }}"
          echo "=============================================="