name: OrangeHRM Master CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Run pipeline up to environment
        required: true
        default: QA
        type: choice
        options:
          - Dev
          - QA
          - Stage
          - Prod

jobs:

  # ==========================================================
  # STEP 1: PREPARE
  # Always runs
  # ==========================================================
  prepare:
    name: Prepare Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Show selected environment
        run: |
          echo "========================================="
          echo " OrangeHRM MASTER PIPELINE"
          echo " Selected Environment: ${{ github.event.inputs.environment }}"
          echo "========================================="


  # ==========================================================
  # STEP 2: DEPLOY DEV
  # Always runs
  # ==========================================================
  deploy-dev:
    name: Deploy to DEV
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Deploy DEV
        run: |
          echo "========================================="
          echo " Deploying OrangeHRM to DEV"
          echo "========================================="
          echo "DEV deployment completed"


  # ==========================================================
  # STEP 3: DEV SANITY TESTS
  # Always runs
  # ==========================================================
  sanity-dev:
    name: DEV - Sanity Tests
    needs: deploy-dev
    runs-on: ubuntu-latest

    environment: Dev

    env:
      ENV: dev
      ORANGE_BASE_URL: ${{ secrets.ORANGE_BASE_URL }}
      ORANGE_USERNAME: ${{ secrets.ORANGE_USERNAME }}
      ORANGE_PASSWORD: ${{ secrets.ORANGE_PASSWORD }}

    steps:

      - name: Checkout OrangeHRM repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Show DEV configuration
        run: |
          echo "Environment: $ENV"
          echo "Suite: sanity"

      - name: Validate DEV secrets
        shell: bash
        run: |
          if [ -z "$ORANGE_BASE_URL" ]; then
            echo "ERROR: ORANGE_BASE_URL is missing"
            exit 1
          fi

          if [ -z "$ORANGE_USERNAME" ]; then
            echo "ERROR: ORANGE_USERNAME is missing"
            exit 1
          fi

          if [ -z "$ORANGE_PASSWORD" ]; then
            echo "ERROR: ORANGE_PASSWORD is missing"
            exit 1
          fi

          echo "DEV secrets are available"

      - name: Run DEV Sanity Tests
        run: |
          echo "========================================="
          echo " Running SANITY tests on DEV"
          echo "========================================="

          npx playwright test \
            --project=chromium \
            --grep "@sanity" \
            --workers=1

      - name: Upload DEV Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-sanity-playwright-report
          path: playwright-report/
          retention-days: 7


  # ==========================================================
  # STEP 4: DEPLOY QA
  # Runs when QA, Stage or Prod selected
  # ==========================================================
  deploy-qa:
    name: Deploy to QA
    needs: sanity-dev

    if: contains(
          fromJSON('["QA","Stage","Prod"]'),
          github.event.inputs.environment
        )

    runs-on: ubuntu-latest

    steps:
      - name: Deploy QA
        run: |
          echo "========================================="
          echo " Deploying OrangeHRM to QA"
          echo "========================================="
          echo "QA deployment completed"


  # ==========================================================
  # STEP 5: QA REGRESSION TESTS
  # Runs when QA, Stage or Prod selected
  # ==========================================================
  regression-qa:
    name: QA - Regression Tests
    needs: deploy-qa

    if: contains(
          fromJSON('["QA","Stage","Prod"]'),
          github.event.inputs.environment
        )

    runs-on: ubuntu-latest

    environment: QA

    env:
      ENV: qa
      ORANGE_BASE_URL: ${{ secrets.ORANGE_BASE_URL }}
      ORANGE_USERNAME: ${{ secrets.ORANGE_USERNAME }}
      ORANGE_PASSWORD: ${{ secrets.ORANGE_PASSWORD }}

    steps:

      - name: Checkout OrangeHRM repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Show QA configuration
        run: |
          echo "Environment: $ENV"
          echo "Suite: regression"

      - name: Validate QA secrets
        shell: bash
        run: |
          if [ -z "$ORANGE_BASE_URL" ]; then
            echo "ERROR: ORANGE_BASE_URL is missing"
            exit 1
          fi

          if [ -z "$ORANGE_USERNAME" ]; then
            echo "ERROR: ORANGE_USERNAME is missing"
            exit 1
          fi

          if [ -z "$ORANGE_PASSWORD" ]; then
            echo "ERROR: ORANGE_PASSWORD is missing"
            exit 1
          fi

          echo "QA secrets are available"

      - name: Run QA Regression Tests
        run: |
          echo "========================================="
          echo " Running REGRESSION tests on QA"
          echo "========================================="

          npx playwright test \
            --project=chromium \
            --grep "@regression" \
            --workers=1

      - name: Upload QA Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-playwright-report
          path: playwright-report/
          retention-days: 7


  # ==========================================================
  # STEP 6: DEPLOY STAGE
  # Runs when Stage or Prod selected
  # ==========================================================
  deploy-stage:
    name: Deploy to STAGE
    needs: regression-qa

    if: contains(
          fromJSON('["Stage","Prod"]'),
          github.event.inputs.environment
        )

    runs-on: ubuntu-latest

    steps:
      - name: Deploy STAGE
        run: |
          echo "========================================="
          echo " Deploying OrangeHRM to STAGE"
          echo "========================================="
          echo "STAGE deployment completed"


  # ==========================================================
  # STEP 7: STAGE SANITY TESTS
  # Runs when Stage or Prod selected
  # ==========================================================
  sanity-stage:
    name: STAGE - Sanity Tests
    needs: deploy-stage

    if: contains(
          fromJSON('["Stage","Prod"]'),
          github.event.inputs.environment
        )

    runs-on: ubuntu-latest

    environment: Stage

    env:
      ENV: stage
      ORANGE_BASE_URL: ${{ secrets.ORANGE_BASE_URL }}
      ORANGE_USERNAME: ${{ secrets.ORANGE_USERNAME }}
      ORANGE_PASSWORD: ${{ secrets.ORANGE_PASSWORD }}

    steps:

      - name: Checkout OrangeHRM repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Show STAGE configuration
        run: |
          echo "Environment: $ENV"
          echo "Suite: sanity"

      - name: Validate STAGE secrets
        shell: bash
        run: |
          if [ -z "$ORANGE_BASE_URL" ]; then
            echo "ERROR: ORANGE_BASE_URL is missing"
            exit 1
          fi

          if [ -z "$ORANGE_USERNAME" ]; then
            echo "ERROR: ORANGE_USERNAME is missing"
            exit 1
          fi

          if [ -z "$ORANGE_PASSWORD" ]; then
            echo "ERROR: ORANGE_PASSWORD is missing"
            exit 1
          fi

          echo "STAGE secrets are available"

      - name: Run STAGE Sanity Tests
        run: |
          echo "========================================="
          echo " Running SANITY tests on STAGE"
          echo "========================================="

          npx playwright test \
            --project=chromium \
            --grep "@sanity" \
            --workers=1

      - name: Upload STAGE Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-sanity-playwright-report
          path: playwright-report/
          retention-days: 7


  # ==========================================================
  # STEP 8: DEPLOY PROD
  # Runs only when Prod selected
  # ==========================================================
  deploy-prod:
    name: Deploy to PROD
    needs: sanity-stage

    if: github.event.inputs.environment == 'Prod'

    runs-on: ubuntu-latest

    steps:
      - name: Deploy PROD
        run: |
          echo "========================================="
          echo " Deploying OrangeHRM to PROD"
          echo "========================================="
          echo "PROD deployment completed"


  # ==========================================================
  # STEP 9: PROD SMOKE TESTS
  # Runs only when Prod selected
  # ==========================================================
  smoke-prod:
    name: PROD - Smoke Tests
    needs: deploy-prod

    if: github.event.inputs.environment == 'Prod'

    runs-on: ubuntu-latest

    environment: Prod

    env:
      ENV: prod
      ORANGE_BASE_URL: ${{ secrets.ORANGE_BASE_URL }}
      ORANGE_USERNAME: ${{ secrets.ORANGE_USERNAME }}
      ORANGE_PASSWORD: ${{ secrets.ORANGE_PASSWORD }}

    steps:

      - name: Checkout OrangeHRM repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Show PROD configuration
        run: |
          echo "Environment: $ENV"
          echo "Suite: smoke"

      - name: Validate PROD secrets
        shell: bash
        run: |
          if [ -z "$ORANGE_BASE_URL" ]; then
            echo "ERROR: ORANGE_BASE_URL is missing"
            exit 1
          fi

          if [ -z "$ORANGE_USERNAME" ]; then
            echo "ERROR: ORANGE_USERNAME is missing"
            exit 1
          fi

          if [ -z "$ORANGE_PASSWORD" ]; then
            echo "ERROR: ORANGE_PASSWORD is missing"
            exit 1
          fi

          echo "PROD secrets are available"

      - name: Run PROD Smoke Tests
        run: |
          echo "========================================="
          echo " Running SMOKE tests on PROD"
          echo "========================================="

          npx playwright test \
            --project=chromium \
            --grep "@smoke" \
            --workers=1

      - name: Upload PROD Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-playwright-report
          path: playwright-report/
          retention-days: 7


  # ==========================================================
  # STEP 10: PIPELINE SUMMARY
  # Always runs
  # ==========================================================
  summary:
    name: Pipeline Summary

    needs:
      - prepare
      - sanity-dev
      - regression-qa
      - sanity-stage
      - smoke-prod

    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: Pipeline Results
        run: |
          echo "=============================================="
          echo "      ORANGEHRM MASTER PIPELINE SUMMARY"
          echo "=============================================="
          echo "Selected environment: ${{ github.event.inputs.environment }}"
          echo "----------------------------------------------"
          echo "Prepare:       ${{ needs.prepare.result }}"
          echo "DEV Sanity:    ${{ needs.sanity-dev.result }}"
          echo "QA Regression: ${{ needs.regression-qa.result }}"
          echo "STAGE Sanity:  ${{ needs.sanity-stage.result }}"
          echo "PROD Smoke:    ${{ needs.smoke-prod.result }}"
          echo "=============================================="
          echo ""
          echo "skipped = environment was not included"